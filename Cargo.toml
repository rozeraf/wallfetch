[package]
name = "wallfetch"
version = "0.2.0"
edition = "2021"
description = "Extract ordered wallpaper palettes and apply them to text templates"
license = "MIT"
repository = "https://github.com/rozeraf/wallfetch"
homepage = "https://github.com/rozeraf/wallfetch"
readme = "README.md"
keywords = ["wallpaper", "palette", "color", "terminal", "noctalia"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
urlencoding = "2.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
